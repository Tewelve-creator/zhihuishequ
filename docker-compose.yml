version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: community-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_community
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/patch_staff_mobile.sql:/docker-entrypoint-initdb.d/02-staff.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: community-redis
    ports:
      - "6379:6379"

  # 图片对象存储（报修现场图等）。控制台 http://localhost:9001  账号 minioadmin/minioadmin
  minio:
    image: minio/minio:latest
    container_name: community-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  gateway:
    build: ./backend/community-gateway
    container_name: zhihuishequ-gateway
    ports:
      - "8080:8080"
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod

  auth:
    build: ./backend/community-auth
    container_name: zhihuishequ-auth
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod

  ai:
    build: ./backend/community-ai
    container_name: zhihuishequ-ai
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod

  repair:
    build: ./backend/community-repair
    container_name: zhihuishequ-repair
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod

  order:
    build: ./backend/community-order
    container_name: zhihuishequ-order
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod

  stats:
    build: ./backend/community-stats
    container_name: zhihuishequ-stats
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod

  saas:
    build: ./backend/community-saas
    container_name: zhihuishequ-saas
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod

volumes:
  minio-data: